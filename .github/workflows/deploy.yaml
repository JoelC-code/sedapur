name: Laravel 12 CI/CD Deployment

on:
  push:
    branches: [ "main" ] # Triggers only when code is pushed to your main production branch

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Run Tests & Build Assets
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Same PHP version as the CloudPanel server (8.4).
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, pdo_sqlite, sqlite3, bcmath, filter, zip
        tools: composer:v2
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Copy Environment File
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

    - name: Generate Application Key
      run: php artisan key:generate

    # Tests use the in-memory SQLite database from phpunit.xml. Never pass DB_* here:
    # RefreshDatabase runs migrate:fresh and would wipe the shared Supabase database.
    - name: Run Tests
      run: php artisan test

    # Checks that the frontend still builds. The deploy job builds again for the server;
    # build output is never committed (public/build is gitignored).
    - name: Install NPM Dependencies & Build Assets
      run: |
        npm ci
        npm run build

  deploy:
    name: Deploy to Live Hosting
    needs: laravel-tests # Ensures deployment only happens if tests pass successfully
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, bcmath, filter, zip
        tools: composer:v2
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    # vendor/ and public/build are gitignored, so they are built here and shipped to the
    # server as one package, since the server has neither Composer nor Node.
    - name: Install Production Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --prefer-dist --no-ansi --no-interaction --no-progress

    - name: Build Frontend Assets
      run: |
        npm ci
        npm run build

    - name: Package Release
      run: tar -czf release.tar.gz vendor public/build

    - name: Upload Release Package to Server
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        source: "release.tar.gz"
        target: "/home/jchristopher-sedapur/htdocs/sedapur.jchristopher.my.id"

    # set -e stops at the first failing command, so a failed migration marks the deploy as failed.
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        script: |
          set -e
          cd /home/jchristopher-sedapur/htdocs/sedapur.jchristopher.my.id
          git pull origin main
          rm -rf vendor public/build
          tar -xzf release.tar.gz
          rm -f release.tar.gz

          rm -f bootstrap/cache/packages.php
          rm -f bootstrap/cache/services.php

          php artisan package:discover --ansi
          php artisan migrate --force
          php artisan config:cache
