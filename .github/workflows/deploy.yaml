name: Laravel 13 CI/CD Deployment

on:
  push:
    branches: [ "main" ] # Triggers only when code is pushed to your main production branch

permissions:
  contents: write

jobs:
  laravel-tests:
    name: Run Tests & Build Assets
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, ctype, iconv, pdo_sqlite, sqlite3, bcmath, filter, zip
        tools: composer:v2
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Copy Environment File
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

    - name: Generate Application Key
      run: php artisan key:generate

    # Tests use the in-memory SQLite database from phpunit.xml. Never pass DB_* here:
    # RefreshDatabase runs migrate:fresh and would wipe the shared Supabase database.
    - name: Run Tests
      run: php artisan test

    # Compile frontend production assets (Vite) so they are ready for deployment
    - name: Install NPM Dependencies & Build Assets
      run: |
        npm ci
        npm run build

    # Optional: Push compiled production assets back to Git if your deployment relies on Git integration
    - name: Commit Built Assets (If required by your hosting Git sync)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add public/build -f
        git diff-index --quiet HEAD || git commit -m "chore: build production assets [skip ci]"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.MY_PAT }}

  deploy:
    name: Deploy to Live Hosting
    needs: laravel-tests # Ensures deployment only happens if tests pass successfully
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        extensions: mbstring, xml, ctype, iconv, bcmath, filter, zip
        tools: composer:v2
        coverage: none

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    # vendor/ is gitignored, so it must be built here (production deps only) and
    # shipped to the server separately, since the server does not have Composer.
    - name: Install Production Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --prefer-dist --no-ansi --no-interaction --no-progress

    - name: Package Vendor Directory
      run: tar -czf vendor.tar.gz vendor

    - name: Upload Vendor Package to Server
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        source: "vendor.tar.gz"
        target: "/home/jchristopher-sedapur/htdocs/sedapur.jchristopher.my.id"

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        script: |
          cd /home/jchristopher-sedapur/htdocs/sedapur.jchristopher.my.id
          git pull origin main
          rm -rf vendor
          tar -xzf vendor.tar.gz
          rm -f vendor.tar.gz

          rm -f bootstrap/cache/packages.php
          rm -f bootstrap/cache/services.php

          php artisan package:discover --ansi
          php artisan migrate --force
          php artisan config:cache
