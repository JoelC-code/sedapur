<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#9a3412">
    <title>Kamu sedang offline · Sedapur</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
        :root {
            color-scheme: light;
            --bg: #f8f2f0;
            --card: #ffffff;
            --line: #eadbd4;
            --accent: #9a3412;
            --accent-soft: #fbede4;
            --brand: #047857;
            --brand-dark: #065f46;
            --ink: #1c1917;
            --muted: #57534e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        main {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            display: grid;
            place-items: center;
        }
        .brand {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent);
        }
        h1 {
            margin: 0;
            font-size: 22px;
            line-height: 1.25;
            font-weight: 800;
        }
        p {
            margin: 10px 0 0;
            font-size: 14px;
            line-height: 1.6;
            color: var(--muted);
        }
        .actions {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        a.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            padding: 0 24px;
            border-radius: 999px;
            background: var(--brand);
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }
        a.btn:hover { background: var(--brand-dark); }
        a.link {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-decoration: none;
            padding: 6px;
        }
        a.link:hover { color: var(--ink); }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h.01"/>
                <path d="M8.5 16.429a5 5 0 0 1 7 0"/>
                <path d="M5 12.859a10 10 0 0 1 5.17-2.69"/>
                <path d="M19 12.859a10 10 0 0 0-2.007-1.523"/>
                <path d="M2 8.82a15 15 0 0 1 4.177-2.643"/>
                <path d="M22 8.82a15 15 0 0 0-11.288-3.764"/>
                <path d="m2 2 20 20"/>
            </svg>
        </div>
        <p class="brand">Sedapur</p>
        <h1>Kamu sedang offline</h1>
        <p>Sedapur butuh koneksi internet untuk memuat isi kulkas dan daftar belanja bersama. Periksa sambunganmu lalu coba lagi.</p>
        <div class="actions">
            <a href="" class="btn">Coba lagi</a>
            <a href="/" class="link">Kembali ke beranda</a>
        </div>
    </main>
</body>
</html>
